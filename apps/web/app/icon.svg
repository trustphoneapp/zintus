<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zintus">
  <!--
    Zintus favicon — the networked "Z" brand mark (same geometry as
    components/ZintusLogo.tsx, scaled 16x from its 0 0 32 32 viewBox), white on
    the Indigo brand rounded square. The nodes evoke the routing/network theme,
    matching the in-app logo instead of a divergent placeholder. A final
    designer-delivered raster can still drop in over this later.
  -->
  <defs>
    <linearGradient id="zintus-mark" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE" />
      <stop offset="1" stop-color="#3550C8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#zintus-mark)" />

  <!-- Z strokes: top -> diagonal -> bottom -->
  <g stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <line x1="112" y1="128" x2="400" y2="128" />
    <line x1="400" y1="128" x2="112" y2="384" />
    <line x1="112" y1="384" x2="400" y2="384" />
  </g>

  <!-- Dimmer midpoint nodes along the diagonal -->
  <circle cx="312" cy="213" r="22" fill="#7C92FE" />
  <circle cx="200" cy="299" r="22" fill="#7C92FE" />

  <!-- Filled node endpoints (the four corners of the Z) -->
  <circle cx="112" cy="128" r="38" fill="#FFFFFF" />
  <circle cx="400" cy="128" r="38" fill="#FFFFFF" />
  <circle cx="112" cy="384" r="38" fill="#FFFFFF" />
  <circle cx="400" cy="384" r="38" fill="#FFFFFF" />
</svg>
