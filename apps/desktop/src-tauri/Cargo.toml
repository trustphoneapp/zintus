[package]
name = "multipleai-desktop"
version = "0.0.1"
description = "MultipleAI desktop shell"
authors = ["MultipleAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "multipleai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.10", features = [] }

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10", features = [] }
tauri-plugin-pty = "0.3"
