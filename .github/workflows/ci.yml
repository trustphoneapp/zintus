name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck

  apps:
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        app:
          - apps/cli
          - apps/web
          - apps/desktop
          - apps/mobile
          - workers/validate-key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: cd ${{ matrix.app }} && bun run typecheck

  cli-smoke:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: cd apps/cli && bun run dev -- --help
