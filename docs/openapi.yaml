openapi: 3.1.0
info:
  title: Zintus Gateway API
  version: 0.0.1
  summary: Zintus gateway for routed chat, research, operations, and supervised engineering runs.
  description: |
    OpenAI-compatible API — set your OpenAI client's `base_url` to the Zintus
    gateway. Zintus chat routes to its OWN provider fleet; OpenAI is not a chat
    backend provider. The chat providers are Cerebras, Groq, Gemini, OpenRouter, Cohere,
    Mistral, DeepSeek, Fireworks AI, xAI Grok, Hugging Face, LM Studio, and
    Ollama.

    Public HTTP API exposed by the Zintus gateway (`apps/gateway`). The chat
    surface (`POST /v1/chat/completions`) reuses OpenAI's request/response field
    NAMES so existing OpenAI/OpenRouter SDKs work unchanged — but only the
    fields Zintus actually accepts (per the @zintus/schemas zod) are supported;
    OpenAI-only params are not documented here. Zintus-specific deviations are
    documented inline (no `created`/`usage`; `id` is a routing trace id; extra
    `provider`/`thread_id`/`compile_trace_id` fields).

    The operational endpoints — `/health`, `/v1/status`, `/v1/savings`,
    `/v1/traces*`, and `/metrics` — are Zintus extensions, not part of the
    OpenAI API.

    The `/v1/engineer/runs*` endpoints are also Zintus extensions. They expose
    the durable, manifest-gated Zintus Engineer workflow. When execution is
    configured, its Phase 2 builder uses the user's OpenAI key and the Responses
    API inside an isolated repository workspace.

    Authentication
    --------------
    Auth is bearer-token based: `Authorization: Bearer <GATEWAY_TOKEN>`. The
    token is matched in constant time against the gateway's configured
    `GATEWAY_TOKEN`.

    - When `GATEWAY_TOKEN` is **set**, every endpoint EXCEPT `GET /health`
      requires the bearer token. `/health` is always unauthenticated.
    - When `GATEWAY_TOKEN` is **unset/empty**, the gateway runs open and all
      endpoints (including `/metrics`) skip the auth check. This is the local
      /dev posture; production deployments are expected to set a token.

    `GET /metrics` is therefore auth-gated *only when a token is configured*.

    This spec is verified against `apps/gateway/src/handler.ts` and cross-checked
    by `apps/gateway/src/openapi-spec.test.ts`. Do not hand-edit it out of sync
    with the handler — the test will fail.
  license:
    name: BUSL-1.1
    url: https://mariadb.com/bsl11/
servers:
  - url: http://localhost:8788
    description: Local gateway (default Bun server port)
  - url: https://gateway.example.com
    description: Self-hosted deployment (replace with your host)

security:
  - bearerAuth: []

tags:
  - name: Chat
    description: OpenAI-compatible chat completions.
  - name: Research
    description: Streaming multi-step deep research.
  - name: Engineer
    description: Durable, manifest-gated Zintus Engineer runs and execution evidence.
  - name: Operations
    description: Health, status, savings, traces, and metrics.

paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness probe (unauthenticated)
      description: |
        Minimal, always-public liveness check. Intentionally does NOT leak
        provider inventory, key presence, live quota, or savings — that lives at
        the auth-gated `GET /v1/status`. Returns 503 while the process is
        draining (graceful shutdown) so load balancers stop routing new traffic.
      security: []
      responses:
        "200":
          description: Process is live and accepting traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                authRequired:
                  value: { ok: true, auth: "required" }
                authDisabled:
                  value: { ok: true, auth: "disabled" }
        "503":
          description: Process is draining (graceful shutdown in progress).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { ok: false, auth: "required", status: "draining" }

  /v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: Create a chat completion (streaming or non-streaming)
      description: |
        OpenAI-compatible chat completion. Routes the request across configured
        free-tier providers, optionally compresses context (intelligent compression) and injects
        web-search results before calling the upstream.

        Provide either `messages`, or `message` together with `thread_id`.

        Streaming (default, `stream` != false) returns an SSE
        `text/event-stream` of `chat.completion.chunk` events terminated by a
        `data: [DONE]` line. `stream: false` returns a single
        `chat.completion` JSON object.

        Response metadata is also surfaced as headers: `X-Provider-Used`,
        `X-Cache-Hit`, `X-Failover-Count`, and (streaming only, when known)
        `X-Compile-Tokens`.

        Deviations from OpenAI: no `created` and no `usage` fields; `id` is the
        internal routing trace id (a UUID); extra `provider`, `thread_id`, and
        `compile_trace_id` fields are included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              simple:
                summary: Minimal non-streaming request
                value:
                  model: llama-3.3-70b
                  stream: false
                  messages:
                    - { role: user, content: "Hello!" }
              withSearch:
                summary: With web search and a pinned provider
                value:
                  provider: groq
                  search: { enabled: true, depth: standard }
                  messages:
                    - { role: user, content: "Latest news on X?" }
      responses:
        "200":
          description: |
            Either a single completion (when `stream: false`) or an SSE stream
            of completion chunks (default).
          headers:
            X-Provider-Used:
              schema: { type: string }
              description: Provider id that served the request.
            X-Cache-Hit:
              schema: { type: string }
              description: Cache outcome (e.g. `miss`, `hit`).
            X-Failover-Count:
              schema: { type: string }
              description: Number of providers tried before success.
            X-Compile-Tokens:
              schema: { type: string }
              description: Estimated compiled context tokens (streaming only, when known).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              x-event-data-schema:
                $ref: "#/components/schemas/ChatCompletionChunk"
              schema:
                type: string
                description: |
                  SSE stream. Each event is `data: <ChatCompletionChunk JSON>\n\n`,
                  terminated by `data: [DONE]\n\n`. On mid-stream failure a
                  `data: { "error": { "message": "..." } }` event is emitted
                  before close. The per-event JSON shape is `ChatCompletionChunk`
                  (see x-event-data-schema / components).
              example: |
                data: {"id":"<uuid>","object":"chat.completion.chunk","model":"llama-3.3-70b","provider":"groq","choices":[{"index":0,"delta":{"content":"Hello"}}]}

                data: [DONE]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/engineer/readiness:
    get:
      tags: [Engineer]
      operationId: getEngineerReadiness
      summary: Get the fail-closed Engineer capability state
      responses:
        "200": { description: Engineer is ready or explicitly disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: One or more mandatory capabilities are unavailable. }

  /v1/engineer/readiness/retry:
    post:
      tags: [Engineer]
      operationId: retryEngineerReadiness
      summary: Explicitly rerun every mandatory Engineer capability probe
      responses:
        "200": { description: All capability probes passed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Capability proof remains incomplete. }

  /v1/engineer/observability:
    get:
      tags: [Engineer]
      operationId: getEngineerObservability
      summary: Get a durable Engineer operations snapshot
      description: Aggregates ledger states, risk tiers, pending approvals, and failure classes without trusting agent narrative.
      responses:
        "200":
          description: Current Engineer control-plane snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot: { $ref: "#/components/schemas/EngineerObservabilitySnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Engineer is not configured. }

  /v1/engineer/repository:
    get:
      tags: [Engineer]
      operationId: getEngineerCanonicalRepository
      summary: Get the only canonical repository snapshot admitted by this gateway
      responses:
        "200":
          description: Authenticated canonical repository and exact accepted base.
          content:
            application/json:
              schema:
                type: object
                required: [repository]
                properties:
                  repository: { $ref: "#/components/schemas/EngineerRepositoryReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Engineer preflight is not ready. }

  /v1/engineer/repositories:
    get:
      tags: [Engineer]
      operationId: listEngineerRepositories
      summary: List repositories admitted for the authenticated Engineer owner
      description: Returns only canonical or connector-authorized repository snapshots bound to the authenticated gateway principal.
      responses:
        "200":
          description: Owner-scoped repositories with exact accepted base commits.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                additionalProperties: false
                properties:
                  repositories:
                    type: array
                    items: { $ref: "#/components/schemas/EngineerRepositoryReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Engineer is not configured or repository admission is unavailable. }

  /v1/engineer/runs:
    get:
      tags: [Engineer]
      operationId: listEngineerRuns
      summary: List durable runs owned by the authenticated Engineer principal
      responses:
        "200":
          description: Runs ordered newest first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/EngineerRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Engineer is not configured. }
    post:
      tags: [Engineer]
      operationId: createEngineerRun
      summary: Create a durable Zintus Engineer run
      description: |
        Records the user request and an exact repository/base-commit reference.
        Creation does not execute code; the run must first receive a frozen task
        manifest and then be started explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineerRunCreateRequest"
      responses:
        "201":
          description: Run created in the REQUEST_RECEIVED state.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/EngineerRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: The Engineer supervisor is not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/engineer/runs/{runId}:
    get:
      tags: [Engineer]
      operationId: getEngineerRun
      summary: Get the authoritative state of an Engineer run
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: Current durable run state and the last asynchronous execution error, if any.
          content:
            application/json:
              schema:
                type: object
                required: [run, lastError]
                properties:
                  run: { $ref: "#/components/schemas/EngineerRun" }
                  lastError: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/plan:
    get:
      tags: [Engineer]
      operationId: getEngineerRunPlan
      summary: Get the latest structured plan proposal
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: The latest proposal, or null before planning completes.
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan:
                    oneOf:
                      - $ref: "#/components/schemas/EngineerPlanProposal"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }
    post:
      tags: [Engineer]
      operationId: planEngineerRun
      summary: Generate and persist a bounded structured plan with TERRA
      description: |
        Runs only from REQUEST_RECEIVED. Model output is schema constrained;
        risk and the human-gate requirement are assigned by deterministic policy.
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: Plan persisted and run advanced to PLAN_READY.
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: "#/components/schemas/EngineerPlanProposal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }
        "409": { description: Planning is unavailable or the run is not in REQUEST_RECEIVED. }

  /v1/engineer/runs/{runId}/freeze-plan:
    post:
      tags: [Engineer]
      operationId: freezeEngineerRunPlan
      summary: Validate and freeze a task manifest
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedStateVersion, manifest, actorId, idempotencyKey]
              additionalProperties: false
              properties:
                expectedStateVersion: { type: integer, minimum: 0 }
                manifest: { $ref: "#/components/schemas/EngineerTaskManifest" }
                actorId: { type: string, minLength: 1 }
                idempotencyKey: { type: string, minLength: 1 }
      responses:
        "200":
          description: Manifest frozen and run advanced to PLAN_FROZEN.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: "#/components/schemas/EngineerRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }
        "409": { description: State/version conflict or plan is already frozen. }

  /v1/engineer/runs/{runId}/start:
    post:
      tags: [Engineer]
      operationId: startEngineerRun
      summary: Durably enqueue an Engineer run for execution and independent verification
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "202":
          description: The QUEUED state was committed before this acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [run, accepted]
                properties:
                  run: { $ref: "#/components/schemas/EngineerRun" }
                  accepted: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }
        "409": { description: Execution is not configured or the run is not ready to start. }

  /v1/engineer/runs/{runId}/recover-stale-base:
    post:
      tags: [Engineer]
      operationId: recoverEngineerStaleBase
      summary: Supersede stale approved work with a clean run on the credentialed current base
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "202":
          description: Replacement run created and planning/execution accepted when no clarification is required.
          content:
            application/json:
              schema:
                type: object
                required: [supersededRun, replacementRun]
                properties:
                  supersededRun: { $ref: "#/components/schemas/EngineerRun" }
                  replacementRun: { $ref: "#/components/schemas/EngineerRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Stale recovery or a required capability is not configured. }

  /v1/engineer/runs/{runId}/events:
    get:
      tags: [Engineer]
      operationId: streamEngineerRunEvents
      summary: Replay and stream durable run-state events
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
        - name: afterSequence
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Replay only events with a greater durable sequence number.
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, minimum: 0 }
          description: Standard SSE resume cursor, used when afterSequence is absent.
      responses:
        "200":
          description: |
            SSE stream of ordered state events. The stream closes at the Phase 3
            REVIEW_APPROVED boundary or at a terminal state.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/artifacts:
    get:
      tags: [Engineer]
      operationId: listEngineerRunArtifacts
      summary: List immutable evidence artifacts owned by a run
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: Artifact metadata; artifact content is not exposed by this endpoint.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/EngineerArtifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/claims:
    get:
      tags: [Engineer]
      operationId: listEngineerRunClaims
      summary: List acceptance claims and their trusted evidence mappings
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: Claims remain UNVERIFIED unless their evidence IDs belong to trusted run artifacts.
          content:
            application/json:
              schema:
                type: object
                required: [claims]
                properties:
                  claims:
                    type: array
                    items: { $ref: "#/components/schemas/EngineerClaimEvidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/evidence:
    get:
      tags: [Engineer]
      operationId: listEngineerRunEvidenceBundles
      summary: List hash-bound verification and review evidence bundles
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: Immutable bundle manifests bound to the frozen manifest, result commit, diff, and trusted evidence.
          content:
            application/json:
              schema:
                type: object
                required: [evidenceBundles]
                properties:
                  evidenceBundles:
                    type: array
                    items: { $ref: "#/components/schemas/EngineerEvidenceBundleRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/evidence-export:
    get:
      tags: [Engineer]
      operationId: exportEngineerRunEvidence
      summary: Download an owner-checked, hash-bound JSON evidence aggregate
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
      responses:
        "200":
          description: Evidence aggregate with a canonical SHA-256 export hash.
          content:
            application/json:
              schema:
                type: object
                required: [exportVersion, run, events, artifacts, claims, evidenceBundles, tests, securityFindings, failures, decisions, exportHash]
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/tests:
    get:
      tags: [Engineer]
      operationId: listEngineerRunTests
      summary: List independently executed verification records
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200": { description: Ordered trusted test execution summaries. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/security:
    get:
      tags: [Engineer]
      operationId: listEngineerRunSecurity
      summary: List deterministic and advisory security findings
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200": { description: Security findings with provenance evidence IDs. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/failures:
    get:
      tags: [Engineer]
      operationId: listEngineerRunFailures
      summary: List classified workflow failures
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200": { description: Durable classified failures and retryability. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/git-operations:
    get:
      tags: [Engineer]
      operationId: listEngineerRunGitOperations
      summary: List durable credentialed Git inspection and publication operations
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200":
          description: Ordered Git operations and remote references.
          content:
            application/json:
              schema:
                type: object
                required: [gitOperations]
                properties:
                  gitOperations:
                    type: array
                    items: { $ref: "#/components/schemas/EngineerGitOperation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/decisions:
    get:
      tags: [Engineer]
      operationId: listEngineerRunDecisions
      summary: List owner-bound ASK_NOW, DEFER, and AUTO decisions
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200": { description: Decision projections with options, recommendation, and resolution status. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/decisions/{decisionId}/resolve:
    post:
      tags: [Engineer]
      operationId: resolveEngineerRunDecision
      summary: Resolve an open decision as the authenticated Engineer reviewer
      parameters:
        - $ref: "#/components/parameters/EngineerRunId"
        - name: decisionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedStateVersion, selectedOptionId, rationale, idempotencyKey]
              properties:
                expectedStateVersion: { type: integer, minimum: 0 }
                selectedOptionId: { type: string }
                rationale: { type: string }
                idempotencyKey: { type: string }
      responses:
        "200": { description: Hash-bound human resolution recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run or decision not found. }

  /v1/engineer/runs/{runId}/diff:
    get:
      tags: [Engineer]
      operationId: getEngineerRunDiff
      summary: Get the exact candidate diff used for review and approval
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200": { description: Git diff text from the retained isolated workspace. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run or retained workspace not found. }

  /v1/engineer/runs/{runId}/approval:
    get:
      tags: [Engineer]
      operationId: getEngineerRunApproval
      summary: Get the latest hash-bound human approval request
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      responses:
        "200": { description: Latest approval request, or null. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Run not found. }

  /v1/engineer/runs/{runId}/approve:
    post:
      tags: [Engineer]
      operationId: approveEngineerRun
      summary: Approve the exact reviewed diff and continue Supervisor publication
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      requestBody: { $ref: "#/components/requestBodies/EngineerHumanDecision" }
      responses:
        "200": { description: Approval recorded and publication result returned. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Publication is unavailable or the approval no longer matches current evidence. }

  /v1/engineer/runs/{runId}/request-changes:
    post:
      tags: [Engineer]
      operationId: requestEngineerRunChanges
      summary: Request human changes without granting publication authority
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      requestBody: { $ref: "#/components/requestBodies/EngineerHumanDecision" }
      responses:
        "200": { description: Run moved to FIX_REQUESTED. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/engineer/runs/{runId}/reject:
    post:
      tags: [Engineer]
      operationId: rejectEngineerRun
      summary: Reject a run at the human gate
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      requestBody: { $ref: "#/components/requestBodies/EngineerHumanDecision" }
      responses:
        "200": { description: Run rejected. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/engineer/runs/{runId}/extend-approval:
    post:
      tags: [Engineer]
      operationId: extendEngineerRunApproval
      summary: Extend a pending approval deadline within policy bounds
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId, reason, extensionSeconds]
              additionalProperties: false
              properties:
                actorId: { type: string, minLength: 1, maxLength: 200 }
                reason: { type: string, maxLength: 10000 }
                extensionSeconds: { type: integer, minimum: 60, maximum: 604800 }
      responses:
        "200": { description: Updated approval deadline. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/engineer/runs/{runId}/cancel:
    post:
      tags: [Engineer]
      operationId: cancelEngineerRun
      summary: Cancel a non-terminal run and clean its isolated workspace
      parameters: [{ $ref: "#/components/parameters/EngineerRunId" }]
      requestBody: { $ref: "#/components/requestBodies/EngineerHumanDecision" }
      responses:
        "200": { description: Run cancellation and cleanup completed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/agents:
    post:
      tags: [Agents]
      operationId: createAgentTask
      summary: Start a sandboxed coding-agent task on the gateway host
      description: |
        Runs the hardened @zintus/agent loop (the same one `zintus agent`
        uses) on the gateway machine, confined to a sandbox root. Every file
        write / allowlisted command pauses as an `approval_required` event
        until resolved via the approvals endpoint, unless `autoApprove` is
        sent explicitly. Progress streams from `/v1/agents/{id}/events`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string }
                root:
                  type: string
                  description: Sandbox root on the gateway host (default ZINTUS_WORKSPACE or cwd).
                maxRounds: { type: integer }
                autoApprove: { type: boolean }
                allowRun: { type: boolean }
                sandbox:
                  type: boolean
                  description: Run allowlisted commands in a hardened Docker container (needs allowRun + Docker on the host).
                sandboxImage: { type: string }
                browse:
                  type: boolean
                  description: Offer the read-only browser tool (needs Playwright on the host; silently unavailable otherwise).
                browseAllowPrivate:
                  type: boolean
                  description: Permit the browser tool to reach private/loopback/link-local hosts (default false — SSRF guard).
                strategy: { type: string }
                mode: { type: string }
      responses:
        "201":
          description: Task created and started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        "400": { description: Missing/invalid task or sandbox root. }
    get:
      tags: [Agents]
      operationId: listAgentTasks
      summary: List agent tasks (this gateway process)
      responses:
        "200": { description: Task summaries. }
  /v1/agents/{id}:
    get:
      tags: [Agents]
      operationId: getAgentTask
      summary: One agent task's summary (status, rounds, pending approvals)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Task summary. }
        "404": { description: Unknown task id. }
  /v1/agents/{id}/events:
    get:
      tags: [Agents]
      operationId: streamAgentEvents
      summary: SSE event stream (full backlog replay, then live)
      description: |
        Events: `started`, `routed`, `text`, `turn_end`, `tool_call`,
        `tool_result`, `approval_required`, `approval_resolved`, `done`,
        `stopped`, `error`. Terminates with `data: [DONE]`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: SSE stream of agent events.
          content:
            text/event-stream: {}
        "404": { description: Unknown task id. }
  /v1/agents/{id}/approvals:
    post:
      tags: [Agents]
      operationId: resolveAgentApproval
      summary: Approve or decline a pending write/run gate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id, approved]
              properties:
                approval_id: { type: string }
                approved: { type: boolean }
      responses:
        "200": { description: Approval resolved. }
        "404": { description: No such pending approval. }
  /v1/agents/{id}/stop:
    post:
      tags: [Agents]
      operationId: stopAgentTask
      summary: Stop a running task (pending gates are declined; fail closed)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Stop requested. }
        "404": { description: Unknown task id. }
  /v1/agents/{id}/resume:
    post:
      tags: [Agents]
      operationId: resumeAgentTask
      summary: Resume an interrupted task from its last round-boundary checkpoint
      description: |
        A run whose gateway process died mid-flight is recovered as
        `interrupted` on restart. This re-runs the same loop from the
        checkpointed conversation. 409 if the task is not interrupted or has no
        checkpoint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Resume started. }
        "409": { description: Not interrupted / nothing to resume from. }
  /v1/agents/{id}/messages:
    post:
      tags: [Agents]
      operationId: followUpAgentTask
      summary: Continue a completed task conversationally (multi-turn session)
      description: |
        Appends a follow-up user message to a done/stopped task's checkpointed
        conversation and re-enters the agent loop in the SAME sandbox root with
        the full prior context. The new exchange's events append to the same
        event backlog (replayable via /events), stamped with an incremented
        `exchange` index. Per-exchange mutation/run budgets are fresh; approval
        gates apply anew. 409 while the task is still running or awaiting
        approval, or when there is no conversation to continue.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200": { description: "Follow-up accepted: `{ continued, exchange }`." }
        "400": { description: Missing message / invalid sandbox root. }
        "404": { description: Unknown task id. }
        "409": { description: Still running / nothing to continue. }

  /v1/research:
    post:
      tags: [Research]
      operationId: createResearch
      summary: Streaming deep research (decompose → search → synthesize)
      description: |
        Decomposes a research question into sub-queries, runs parallel web
        searches, and synthesizes a cited answer — streamed as SSE progress
        events. Requires the gateway to be configured with `TAVILY_API_KEY` or
        `SERPER_API_KEY` (returns 400 otherwise).

        Each SSE event is formatted `event: <type>\ndata: <JSON>\n\n`, where
        `<type>` is one of `queries`, `search_start`, `search_complete`,
        `synthesizing`, `answer_chunk`, `done`, `error`. The stream terminates
        with `data: [DONE]\n\n`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRequest"
            example:
              query: "Compare the latest free-tier LLM inference providers"
              depth: standard
      responses:
        "200":
          description: SSE stream of research progress events.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: queries
                data: {"type":"queries","queries":["...","..."]}

                event: answer_chunk
                data: {"type":"answer_chunk","text":"..."}

                event: done
                data: {"type":"done","sources":[{"title":"...","url":"...","content":"..."}]}

                data: [DONE]
        "400":
          description: |
            Invalid body, empty `query`, or no search key configured on the
            gateway. Body is `{ error: { message } }` (with `issues` for zod
            validation failures).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/mcp/discover:
    post:
      tags: [MCP]
      operationId: discoverMcpServer
      summary: Connect (cached) to an MCP server and list its tools/resources/prompts
      description: |
        Connects the gateway to a single MCP (Model Context Protocol) server and
        returns its advertised tools, resources, and prompts — for the UI's
        Test-connection / tool-list flow. Connections are CACHED + reused. The
        gateway HOSTS MCP clients server-side (the browser cannot spawn stdio).
        No-custody: MCP traffic never touches the Zintus relay, and tool
        args/results are never logged. Tools are returned both raw (`name`) and
        namespaced (`namespacedName` = `mcp__<serverId>__<tool>`), the name the
        chat path exposes to the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: "#/components/schemas/MCPServerConfig"
      responses:
        "200":
          description: The server's namespaced tools, resources, and prompts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverId: { type: string }
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        namespacedName: { type: string }
                        description: { type: string }
                        inputSchema: { type: object }
                  resources: { type: array, items: { type: object } }
                  prompts: { type: array, items: { type: object } }
                  connectedAt: { type: integer }
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: |
            The MCP server could not be reached (spawn failed, unreachable, or the
            handshake timed out). Body is `{ error: { type:"mcp_connect_error", message } }`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/mcp:
    delete:
      tags: [MCP]
      operationId: disconnectMcpServer
      summary: Disconnect + evict a cached MCP server connection
      description: |
        Disconnects a previously-connected MCP server (killing any stdio child)
        and evicts it from the registry. Idempotent: returns `{ ok:true }` even
        if the server was never connected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: "#/components/schemas/MCPServerConfig"
      responses:
        "200":
          description: Disconnected (or no-op).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/mcp/disconnect:
    post:
      tags: [MCP]
      operationId: disconnectMcpServerPost
      summary: Disconnect + evict a cached MCP server connection (POST alias)
      description: |
        Identical to `DELETE /v1/mcp` — provided for clients/proxies that cannot
        send a body with DELETE. Body is `{ config }`; idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: "#/components/schemas/MCPServerConfig"
      responses:
        "200":
          description: Disconnected (or no-op).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/status:
    get:
      tags: [Operations]
      operationId: getStatus
      summary: Operational snapshot (auth-gated)
      description: |
        Authenticated operational snapshot: provider inventory, key presence,
        cooldown state, live quota usage/limits, and provable savings. Moved
        behind auth (away from `/health`) to avoid disclosing operator topology.
      responses:
        "200":
          description: Provider topology, quota, and savings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/route/options:
    get:
      tags: [Operations]
      operationId: getRouteOptions
      summary: BYOK quota-exhaustion decision (auth-gated)
      description: |
        Local, BYOK-only decision API: given a provider (and an optional `quota`
        hint), it returns what the UI should do when that provider's free-tier
        quota is low or exhausted — derived ONLY from local provider/quota/runtime
        state. The only recommended actions are the BYOK options
        `compress_harder`, `switch_provider`, `use_local`, and `wait`. It never
        bills, holds funds, manages keys, or exposes a paid/credits/overflow path,
        and the response carries only derived fields (no API keys, prompt content,
        or secrets). `resetIn` is returned only when the ledger genuinely tracks a
        reset time (e.g. a 429 / Groq reset header); otherwise it is `null` with a
        `resetReason`. `alternatives` are cheapest-healthy BYOK providers priced
        from a static estimate catalog (not billing truth).
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider to evaluate. Must be a known provider id.
          schema:
            type: string
        - name: quota
          in: query
          required: false
          description: |
            Optional client hint for remaining quota (0..1). Ignored when the
            server's ledger has a value for the provider.
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: The recommended BYOK action and supporting context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteOptions"
        "400":
          description: Missing or unknown provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: { message: "Unknown provider: anthropic" } }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/savings:
    get:
      tags: [Operations]
      operationId: getSavings
      summary: Provable savings estimate (auth-gated)
      description: |
        Estimated USD a paid API would have charged for the free-tier tokens
        served so far. Labelled an estimate vs. paid-API list pricing.
      responses:
        "200":
          description: Savings estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Savings"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/activity:
    get:
      tags: [Operations]
      operationId: listActivity
      summary: Paginated usage history (auth-gated)
      description: |
        OpenRouter-style `/activity`: a paginated feed of recorded request usage,
        derived from the SAME routing traces as `/v1/traces` and normalized to a
        stable per-request shape. Free-core: cost is `0` on the free tier and is
        never fabricated; token counts default to `0` when not recorded,
        `cache_hit` defaults to `false`, and `route_reason` is OMITTED when the
        trace did not record one. Returns an empty `data` list when no usage has
        been recorded.
      parameters:
        - name: limit
          in: query
          required: false
          description: Max entries to return. Defaults to 50, capped at 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: provider
          in: query
          required: false
          description: Filter the page to a single provider id.
          schema:
            type: string
        - name: model
          in: query
          required: false
          description: Filter the page to a single model id.
          schema:
            type: string
      responses:
        "200":
          description: Recorded usage entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/key:
    get:
      tags: [Operations]
      operationId: getKeyStatus
      summary: Key / quota introspection (auth-gated)
      description: |
        OpenRouter-style `/key`: introspection for the authed gateway token.
        Free-core: `is_free_tier` is always true and `managed_keys_available` is
        always false (Zintus never custodies provider keys). Per-provider quota is
        sourced from the SAME live provider status as `/v1/status`. Honest:
        `quota_limit` is null when the provider does not report a denominator
        (never a fabricated cap), and `quota_remaining_ratio` is null whenever the
        limit is unknown.
      responses:
        "200":
          description: Token + per-provider quota status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/transcribe:
    post:
      tags: [Operations]
      operationId: transcribeAudio
      summary: Transcribe a short audio clip with Whisper (auth-gated)
      description: |
        Voice input v1: transcribes a recorded clip with Groq Whisper using the
        caller's OWN stored Groq key. Audio travels only caller → this local
        gateway → Groq; it is never logged, stored, or sent to the relay.
        Returns 422 with code `no_transcription_key` when no Groq key exists —
        the UI shows that honestly instead of faking dictation. 413 over 20MB;
        502 when Groq is unreachable (never conflated with a bad key).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio clip (webm/mp4/wav). Never persisted.
      responses:
        "200":
          description: Transcription result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: transcription }
                  text: { type: string }
        "422":
          description: No Groq key stored — voice input unavailable.
  /v1/keys/validate:
    post:
      tags: [Operations]
      operationId: validateProviderKey
      summary: Test a provider API key (auth-gated)
      description: |
        Explicit key test for GUI surfaces (feature matrix #20). The key travels
        ONLY from the caller to this local gateway and then to the provider's own
        auth-check endpoint — it is never logged, stored, or sent to the relay.
        Local runtimes (ollama, lmstudio) have no key and return 400. A 502 means
        the provider was unreachable — reachability failure is never conflated
        with key rejection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, key]
              properties:
                providerId:
                  type: string
                  description: Provider id (e.g. groq).
                key:
                  type: string
                  description: The API key to test. Never persisted.
      responses:
        "200":
          description: Validation verdict from the provider's auth endpoint.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [key_validation]
                  provider:
                    type: string
                  valid:
                    type: boolean
        "400":
          description: Unknown provider, local runtime, missing key, or bad JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Provider unreachable — could not test (NOT a rejection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/traces:
    get:
      tags: [Operations]
      operationId: listTraces
      summary: List recent routing traces (auth-gated)
      parameters:
        - name: limit
          in: query
          required: false
          description: Max traces to return. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Recent routing traces, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [traces]
                additionalProperties: false
                properties:
                  traces:
                    type: array
                    items:
                      $ref: "#/components/schemas/RequestTrace"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/traces/last:
    get:
      tags: [Operations]
      operationId: getLastTrace
      summary: Most recent routing trace (auth-gated)
      responses:
        "200":
          description: The last trace, or null if none recorded yet.
          content:
            application/json:
              schema:
                type: object
                required: [trace]
                additionalProperties: false
                properties:
                  trace:
                    oneOf:
                      - $ref: "#/components/schemas/RequestTrace"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/traces/{id}:
    get:
      tags: [Operations]
      operationId: getTrace
      summary: Fetch a routing trace by id (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested trace.
          content:
            application/json:
              schema:
                type: object
                required: [trace]
                additionalProperties: false
                properties:
                  trace:
                    $ref: "#/components/schemas/RequestTrace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Trace not found. NOTE: on this route `error` is a bare STRING, not
            an object — `{ "error": "trace not found" }`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringError"
              example: { error: "trace not found" }

  /v1/models:
    get:
      tags: [Chat]
      operationId: listModels
      summary: List available models (OpenAI-compatible, enriched, auth-gated)
      description: |
        OpenRouter-grade model catalog. The envelope and each entry's
        `{ id, object, owned_by }` triple stay OpenAI-compatible, while every
        entry additionally carries `display_name`, `context_window`,
        `capabilities` (vision/tools/structured_output), `pricing`
        (USD per 1M tokens, null when unknown), `free`, `local`, and
        `data_policy`. Optional query filters narrow the catalog server-side.
      parameters:
        - name: provider
          in: query
          required: false
          description: Only models served by this provider id.
          schema:
            $ref: "#/components/schemas/ProviderId"
        - name: vision
          in: query
          required: false
          description: When `true`, only vision-capable models.
          schema: { type: boolean }
        - name: tools
          in: query
          required: false
          description: When `true`, only tool/function-calling models.
          schema: { type: boolean }
        - name: free
          in: query
          required: false
          description: When `true`, only models whose list price is $0.
          schema: { type: boolean }
        - name: local
          in: query
          required: false
          description: When `true`, only local-runtime models (LM Studio, Ollama).
          schema: { type: boolean }
      responses:
        "200":
          description: Enriched, optionally-filtered model catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              example:
                object: list
                data:
                  - id: gemini-2.5-flash
                    object: model
                    owned_by: Gemini
                    display_name: "Gemini · gemini-2.5-flash"
                    context_window: 1000000
                    capabilities: { vision: true, tools: true, structured_output: json_schema }
                    pricing: { input_per_1m: 0.3, output_per_1m: 2.5 }
                    free: false
                    local: false
                    data_policy: { trains_on_data: true, badge: trains, zdr: false }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/pricing:
    get:
      tags: [Operations]
      operationId: listPricing
      summary: List per-model pricing (auth-gated)
      description: |
        Pricing-transparency catalog. Returns one entry per model with a KNOWN
        list price (USD per 1M tokens); models with unknown prices are omitted —
        prices are never invented. This is reference data only: Zintus is BYOK and
        never bills.
      responses:
        "200":
          description: Per-model list pricing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingList"
              example:
                object: list
                data:
                  - { id: gemini-2.5-flash, provider: gemini, input_per_1m: 0.3, output_per_1m: 2.5, free: false }
                  - { id: llama3.3, provider: ollama, input_per_1m: 0, output_per_1m: 0, free: true }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/threads:
    get:
      tags: [Operations]
      operationId: listThreads
      summary: List conversation threads (auth-gated)
      responses:
        "200":
          description: All known conversation threads.
          content:
            application/json:
              schema:
                type: object
                required: [threads]
                additionalProperties: false
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/Thread"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/threads/{id}/state:
    get:
      tags: [Operations]
      operationId: getThreadState
      summary: Get a thread's compiled state (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            The thread's persisted state object, or null if the thread has no
            state. The state is an open key/value record (contents are
            engine-internal and not part of this contract).
          content:
            application/json:
              schema:
                type: object
                required: [state]
                additionalProperties: false
                properties:
                  state:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/threads/{id}/compile:
    post:
      tags: [Operations]
      operationId: compileThread
      summary: Preview a thread's compiled context bundle (auth-gated)
      description: |
        Compiles (without sending) the context bundle the engine would build for
        the next turn on this thread, optionally folding in a pending `message`.
        Returns the compiled message bundle and a compile trace id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                message:
                  oneOf:
                    - type: string
                    - type: object
                      required: [content]
                      additionalProperties: false
                      properties:
                        role: { type: string }
                        content: { type: string }
                mode:
                  type: string
                  enum: [fast, smart, deep]
      responses:
        "200":
          description: Compiled context preview.
          content:
            application/json:
              schema:
                type: object
                required: [thread_id, compile_trace_id, bundle]
                additionalProperties: false
                properties:
                  thread_id: { type: string }
                  compile_trace_id: { type: string }
                  bundle:
                    type: object
                    required: [messages]
                    additionalProperties: false
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/threads/{id}/messages:
    get:
      tags: [Operations]
      operationId: getThreadMessages
      summary: List a thread's stored messages (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The thread's persisted messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                additionalProperties: false
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThreadMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/threads/{id}/memory:
    get:
      tags: [Operations]
      operationId: listThreadMemory
      summary: List a thread's memory facts (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The thread's memory facts (pinned first).
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryFact" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/memory:
    get:
      tags: [Operations]
      operationId: listMemory
      summary: List memory facts by scope (auth-gated)
      description: >
        User-owned memory governance. Facts are background data, never
        instructions. Filter by scope, optionally narrowed to a thread/project.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [thread, project, global] }
        - name: thread_id
          in: query
          schema: { type: string }
        - name: project_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching facts (pinned first, then most-recently-updated).
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryFact" }
        "400":
          description: scope must be one of thread|project|global.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Operations]
      operationId: createMemory
      summary: Create or replace a memory fact (auth-gated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                scope:
                  type: string
                  enum: [thread, project, global]
                  default: thread
                thread_id: { type: string }
                project_id: { type: string }
                key: { type: string }
                value: { type: string }
                source: { type: string }
                source_message_id: { type: string }
                pinned: { type: boolean }
      responses:
        "201":
          description: The created fact.
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory: { $ref: "#/components/schemas/MemoryFact" }
        "400":
          description: key and value are required.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/memory/{id}:
    patch:
      tags: [Operations]
      operationId: updateMemory
      summary: Edit a fact's text and/or pin state (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
                value: { type: string }
                pinned: { type: boolean }
      responses:
        "200":
          description: The updated fact.
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory: { $ref: "#/components/schemas/MemoryFact" }
        "400":
          description: No editable fields provided (key|value|pinned).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Fact not found.
    delete:
      tags: [Operations]
      operationId: deleteMemory
      summary: Delete a fact by id (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Fact not found.

  /v1/compile/traces/{id}:
    get:
      tags: [Operations]
      operationId: getCompileTrace
      summary: Fetch a context-compile trace by id (auth-gated)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The compile trace.
          content:
            application/json:
              schema:
                type: object
                required: [trace]
                additionalProperties: false
                properties:
                  trace:
                    $ref: "#/components/schemas/CompileTrace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Compile trace not found. NOTE: `error` is a bare STRING here —
            `{ "error": "compile trace not found" }`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringError"
              example: { error: "compile trace not found" }

  /metrics:
    get:
      tags: [Operations]
      operationId: getMetrics
      summary: Metrics (Prometheus text or JSON)
      description: |
        Returns Prometheus exposition text when the `Accept` header includes
        `text/plain`, otherwise a JSON metrics snapshot. Auth-gated ONLY when
        `GATEWAY_TOKEN` is configured; open otherwise.
      responses:
        "200":
          description: Metrics snapshot.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus exposition format (version 0.0.4).
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <GATEWAY_TOKEN>`. Required for all endpoints
        except `GET /health` whenever the gateway has a `GATEWAY_TOKEN`
        configured. When no token is configured the gateway runs open and the
        bearer is not checked.

  responses:
    BadRequest:
      description: |
        Invalid JSON, schema-validation failure, or unsupported message role.
        Body is `{ error: { message } }`; zod failures add a field-level
        `issues` array.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidJson:
              value: { error: { message: "Invalid JSON body" } }
            zod:
              value:
                error:
                  message: "Invalid request body"
                  issues:
                    - { path: "messages.0.content", message: "Expected string" }
    Unauthorized:
      description: Missing or invalid bearer token (when a token is configured).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { message: "Unauthorized" } }
    RequestTimeout:
      description: Upstream did not start streaming within the request timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { message: "Request timed out while starting the upstream stream" } }
    PayloadTooLarge:
      description: Request body exceeds the byte cap, or too many messages.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooLarge:
              value: { error: { message: "Request body too large" } }
            tooMany:
              value: { error: { message: "Too many messages (max 200)" } }
    RateLimited:
      description: |
        Per-client rate limit exceeded (only when the gateway is started with
        `GATEWAY_RATELIMIT_RPM`). Includes a `Retry-After` header in seconds.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the next request is allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: { message: "Rate limit exceeded", type: "rate_limit_error" } }

  parameters:
    EngineerRunId:
      name: runId
      in: path
      required: true
      description: Durable Engineer run identifier.
      schema: { type: string, minLength: 1, maxLength: 200 }

  requestBodies:
    EngineerHumanDecision:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EngineerHumanDecisionRequest" }

  schemas:
    EngineerHumanDecisionRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        actorId: { type: string, minLength: 1, maxLength: 200, deprecated: true, description: Ignored; authority comes from the authenticated gateway principal. }
        reason: { type: string, maxLength: 10000 }

    EngineerObservabilitySnapshot:
      type: object
      required: [generatedAt, totalRuns, activeRuns, terminalRuns, pendingApprovals, completedRuns, failedRuns, successRate, stuckRuns, retryAttempts, totalInputTokens, totalOutputTokens, cachedInputTokens, cacheWriteInputTokens, estimatedCostUsd, averageApprovalLatencySeconds, evidenceCompleteRuns, runsByState, runsByRisk, failuresByClass, runHealth]
      additionalProperties: false
      properties:
        generatedAt: { type: string, format: date-time }
        totalRuns: { type: integer, minimum: 0 }
        activeRuns: { type: integer, minimum: 0 }
        terminalRuns: { type: integer, minimum: 0 }
        pendingApprovals: { type: integer, minimum: 0 }
        completedRuns: { type: integer, minimum: 0 }
        failedRuns: { type: integer, minimum: 0 }
        successRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        stuckRuns: { type: integer, minimum: 0 }
        retryAttempts: { type: integer, minimum: 0 }
        totalInputTokens: { type: integer, minimum: 0 }
        totalOutputTokens: { type: integer, minimum: 0 }
        cachedInputTokens: { type: integer, minimum: 0 }
        cacheWriteInputTokens: { type: integer, minimum: 0 }
        estimatedCostUsd: { type: number, minimum: 0 }
        averageApprovalLatencySeconds: { type: [number, "null"], minimum: 0 }
        evidenceCompleteRuns: { type: integer, minimum: 0 }
        runsByState: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        runsByRisk: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        failuresByClass: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        runHealth:
          type: array
          items:
            type: object
            required: [runId, state, riskTier, ageInStateSeconds, stuck, retryAttempts, failureCount]
            additionalProperties: false
            properties:
              runId: { type: string }
              state: { type: string }
              riskTier: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
              ageInStateSeconds: { type: integer, minimum: 0 }
              stuck: { type: boolean }
              retryAttempts: { type: integer, minimum: 0 }
              failureCount: { type: integer, minimum: 0 }

    EngineerRepositoryReference:
      type: object
      required: [repositoryId, provider, owner, name, baseBranch, baseCommitSha]
      additionalProperties: false
      properties:
        repositoryId: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, enum: [github, local] }
        owner: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri }
        baseBranch: { type: string, minLength: 1, maxLength: 250 }
        baseCommitSha:
          type: string
          pattern: "^[a-fA-F0-9]{40}([a-fA-F0-9]{24})?$"

    EngineerRunCreateRequest:
      type: object
      required: [repository, request]
      additionalProperties: false
      properties:
        runId: { type: string, minLength: 1, maxLength: 200 }
        userId: { type: string, minLength: 1, maxLength: 200, deprecated: true, description: Ignored; ownership comes from the authenticated gateway principal. }
        userEmail: { type: string, format: email }
        repository: { $ref: "#/components/schemas/EngineerRepositoryReference" }
        request: { type: string, minLength: 1, maxLength: 100000 }

    EngineerGitOperation:
      type: object
      required: [gitOperationId, runId, operationType, requestedBy, idempotencyKey, expectedBaseCommitSha, resultCommitSha, approvalId, evidenceBundleHash, status, remoteReference, startedAt, completedAt, errorCode]
      additionalProperties: false
      properties:
        gitOperationId: { type: string }
        runId: { type: string }
        operationType: { type: string, enum: [CREATE_BRANCH, PUSH_COMMIT, CREATE_PR, INSPECT_BASE, REBASE_CANDIDATE] }
        requestedBy: { type: string, const: SUPERVISOR }
        idempotencyKey: { type: string }
        expectedBaseCommitSha: { type: string }
        resultCommitSha: { type: [string, "null"] }
        approvalId: { type: [string, "null"] }
        evidenceBundleHash: { type: [string, "null"] }
        status: { type: string, enum: [STARTED, SUCCEEDED, FAILED, STALE] }
        remoteReference: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        errorCode: { type: [string, "null"] }

    EngineerRun:
      type: object
      required:
        - runId
        - userId
        - repository
        - requestOriginal
        - requestNormalized
        - state
        - stateVersion
        - manifestHash
        - riskTier
        - humanGateRequired
        - createdAt
        - updatedAt
        - terminalAt
      additionalProperties: false
      properties:
        runId: { type: string }
        userId: { type: string }
        repository: { $ref: "#/components/schemas/EngineerRepositoryReference" }
        requestOriginal: { type: string }
        requestNormalized: { type: string }
        state:
          type: string
          description: Authoritative state from the versioned Engineer state machine.
        stateVersion: { type: integer, minimum: 0 }
        manifestHash:
          type: [string, "null"]
          pattern: "^sha256:[a-f0-9]{64}$"
        riskTier: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        humanGateRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        terminalAt: { type: [string, "null"], format: date-time }

    EngineerTaskManifest:
      type: object
      description: |
        Immutable execution contract. Commands and file paths outside this
        manifest are rejected by the trusted executor and builder tools.
      required:
        - manifestVersion
        - runId
        - repository
        - request
        - acceptanceCriteria
        - testPlan
        - allowedPaths
        - deniedPaths
        - allowedCommands
        - prohibitedCommands
        - riskTier
        - humanGateRequired
        - retryBudgets
        - timeBudgetSeconds
        - tokenBudget
        - costBudgetUsd
        - createdAt
      additionalProperties: false
      properties:
        manifestVersion: { type: integer, minimum: 1 }
        runId: { type: string, minLength: 1 }
        repository: { $ref: "#/components/schemas/EngineerRepositoryReference" }
        request:
          type: object
          required: [original, normalized]
          additionalProperties: false
          properties:
            original: { type: string, minLength: 1 }
            normalized: { type: string, minLength: 1 }
        acceptanceCriteria:
          type: array
          minItems: 1
          items:
            type: object
            required: [criterionId, statement, verificationMethod]
            additionalProperties: false
            properties:
              criterionId: { type: string, minLength: 1 }
              statement: { type: string, minLength: 1 }
              verificationMethod: { type: string, minLength: 1 }
              priority: { type: string, enum: [MUST, SHOULD, MAY], default: MUST }
        testPlan:
          type: array
          minItems: 1
          items:
            type: object
            required: [testId, criterionIds, type, description]
            additionalProperties: false
            properties:
              testId: { type: string, minLength: 1 }
              criterionIds:
                type: array
                minItems: 1
                items: { type: string }
              type:
                type: string
                enum: [FORMAT, LINT, TYPECHECK, BUILD, UNIT, INTEGRATION, E2E, SECURITY, MIGRATION, REGRESSION]
              description: { type: string, minLength: 1 }
              command: { type: string, minLength: 1 }
        allowedPaths:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        deniedPaths:
          type: array
          items: { type: string, minLength: 1 }
        allowedCommands:
          type: array
          items: { type: string, minLength: 1 }
        prohibitedCommands:
          type: array
          items: { type: string, minLength: 1 }
        riskTier: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        humanGateRequired: { type: boolean }
        retryBudgets:
          type: object
          required:
            - sameFailureAttempts
            - builderRepairAttempts
            - reviewerFixAttempts
            - plannerRestarts
            - sandboxProvisioningAttempts
            - transientModelAttempts
          additionalProperties: false
          properties:
            sameFailureAttempts: { type: integer, minimum: 0, maximum: 10 }
            builderRepairAttempts: { type: integer, minimum: 0, maximum: 20 }
            reviewerFixAttempts: { type: integer, minimum: 0, maximum: 10 }
            plannerRestarts: { type: integer, minimum: 0, maximum: 5 }
            sandboxProvisioningAttempts: { type: integer, minimum: 0, maximum: 10 }
            transientModelAttempts: { type: integer, minimum: 0, maximum: 10 }
        timeBudgetSeconds: { type: integer, minimum: 1 }
        tokenBudget: { type: integer, minimum: 0 }
        costBudgetUsd: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }

    EngineerPlanProposal:
      type: object
      required: [planProposalId, runId, manifest, proposalHash, artifactId, createdAt]
      additionalProperties: false
      properties:
        planProposalId: { type: string }
        runId: { type: string }
        manifest: { $ref: "#/components/schemas/EngineerTaskManifest" }
        proposalHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        artifactId: { type: string }
        createdAt: { type: string, format: date-time }

    EngineerArtifact:
      type: object
      required:
        - artifactId
        - runId
        - type
        - sha256
        - producerType
        - producerId
        - storageReference
        - sizeBytes
        - trusted
        - createdAt
      additionalProperties: false
      properties:
        artifactId: { type: string }
        runId: { type: string }
        type: { type: string }
        sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        producerType: { type: string, enum: [EXECUTOR, SYSTEM] }
        producerId: { type: string }
        storageReference: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        trusted: { type: boolean }
        createdAt: { type: string, format: date-time }

    EngineerClaimEvidence:
      type: object
      required: [claimId, claim, status, evidenceIds, notes, runId, criterionId, createdAt]
      additionalProperties: false
      properties:
        claimId: { type: string }
        claim: { type: string }
        status:
          type: string
          enum: [VERIFIED, PARTIALLY_VERIFIED, FAILED, UNVERIFIED, BLOCKED_BY_INFRASTRUCTURE, BLOCKED_BY_EXTERNAL_DEPENDENCY, HUMAN_REVIEW_REQUIRED]
        evidenceIds:
          type: array
          items: { type: string }
        notes: { type: string }
        runId: { type: string }
        criterionId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    EngineerEvidenceBundleRecord:
      type: object
      required: [evidenceBundleId, bundle, bundleHash]
      additionalProperties: false
      properties:
        evidenceBundleId: { type: string }
        bundleHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        bundle:
          type: object
          required: [bundleVersion, runId, manifestHash, baseCommitSha, resultCommitSha, environmentDigest, artifacts, claims, finalDecision, createdAt]
          additionalProperties: false
          properties:
            bundleVersion: { type: integer, minimum: 1 }
            runId: { type: string }
            manifestHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
            baseCommitSha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
            resultCommitSha: { type: string, pattern: "^[a-f0-9]{40,64}$" }
            environmentDigest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
            artifacts:
              type: array
              items:
                type: object
                required: [artifactId, type, sha256, createdAt, producer, sizeBytes]
                additionalProperties: false
                properties:
                  artifactId: { type: string }
                  type: { type: string }
                  sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
                  createdAt: { type: string, format: date-time }
                  producer: { type: string }
                  sizeBytes: { type: integer, minimum: 0 }
            claims:
              type: array
              items:
                type: object
                required: [claimId, claim, status, evidenceIds, notes]
                additionalProperties: false
                properties:
                  claimId: { type: string }
                  claim: { type: string }
                  status:
                    type: string
                    enum: [VERIFIED, PARTIALLY_VERIFIED, FAILED, UNVERIFIED, BLOCKED_BY_INFRASTRUCTURE, BLOCKED_BY_EXTERNAL_DEPENDENCY, HUMAN_REVIEW_REQUIRED]
                  evidenceIds:
                    type: array
                    items: { type: string }
                  notes: { type: string }
            finalDecision: { type: string }
            createdAt: { type: string, format: date-time }

    Health:
      type: object
      required: [ok, auth]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          description: False while draining.
        auth:
          type: string
          enum: [required, disabled]
          description: Whether a `GATEWAY_TOKEN` is configured.
        status:
          type: string
          enum: [draining]
          description: Present only while the process is draining.

    ChatRole:
      type: string
      enum: [system, user, assistant]

    ChatMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string

    ProviderId:
      type: string
      description: Supported provider ids (an unknown value is rejected with 400).
      enum:
        - cerebras
        - groq
        - gemini
        - openrouter
        - cohere
        - mistral
        - deepseek
        - fireworks
        - xai
        - huggingface
        - lmstudio
        - ollama

    SearchOptions:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        depth:
          type: string
          enum: [basic, standard, deep]
        maxResults:
          type: integer
          minimum: 1
          maximum: 50

    ChatCompletionRequest:
      type: object
      description: |
        Mirrors @zintus/schemas ChatCompletionRequestSchema. Unknown keys are
        stripped. Provide `messages`, or `message` + `thread_id`.
      additionalProperties: false
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        message:
          description: A single message (string or object). Used with `thread_id`.
          oneOf:
            - type: string
            - type: object
              required: [content]
              additionalProperties: false
              properties:
                role: { type: string }
                content: { type: string }
        model:
          type: string
          description: |
            Provider-specific model id (e.g. `llama-3.3-70b-versatile` on Groq,
            `gemini-2.0-flash` on Gemini). Optional; the router picks a default.
        stream:
          type: boolean
          description: Defaults to true (SSE). Set false for a single JSON response.
        provider:
          $ref: "#/components/schemas/ProviderId"
        thread_id:
          type: string
        persist:
          type: boolean
          description: >
            Local durability control (default true). Set `false` for
            incognito/private turns: the gateway writes NO durable state for the
            request — conversation history, memory facts, thread summary, memory
            chunks, compile traces, response cache, and the activity log are all
            skipped, and OTel trace export is suppressed. Orthogonal to
            `block_training` (which only avoids providers that may train on the
            prompt); this controls LOCAL persistence, not provider routing.
        mode:
          type: string
          enum: [fast, smart, deep]
          description: Context-compilation mode.
        virtual_key:
          type: string
        virtualKey:
          type: string
          description: camelCase alias of `virtual_key`.
        provider_weights:
          type: object
          additionalProperties: { type: number }
        providerWeights:
          type: object
          additionalProperties: { type: number }
          description: camelCase alias of `provider_weights`.
        strategy:
          type: string
          enum: [fastest, capability, economy, quality, balanced, weighted]
        temperature:
          type: number
        max_tokens:
          type: integer
          minimum: 1
        diff:
          type: string
          description: Optional diff text for code-aware context compilation.
        search:
          $ref: "#/components/schemas/SearchOptions"
        tools:
          type: array
          description: |
            Tool/function definitions the model may call this turn. Presence
            requires a tool-capable provider/model — an unsupported provider
            yields a 422 `unsupported_capability` (required: ["tools"]).
          items:
            $ref: "#/components/schemas/ToolDefinition"
        tool_choice:
          description: How the model may use `tools` this turn (default auto).
          oneOf:
            - type: string
              enum: [auto, required, none]
            - type: object
              required: [type, name]
              additionalProperties: false
              properties:
                type: { type: string, const: tool }
                name: { type: string }
        response_format:
          $ref: "#/components/schemas/ResponseFormat"
        mcp:
          $ref: "#/components/schemas/MCPRequest"

    MCPServerConfig:
      type: object
      description: |
        How to reach an MCP (Model Context Protocol) server. Discriminated on
        `transport`. `stdio` spawns a LOCAL process from the USER'S OWN config
        (hosted by the loopback gateway — the browser cannot); `sse`/`http` reach
        a remote MCP endpoint.
      oneOf:
        - type: object
          required: [transport, command]
          properties:
            transport: { type: string, const: stdio }
            command: { type: string }
            args: { type: array, items: { type: string } }
            env:
              type: object
              additionalProperties: { type: string }
        - type: object
          required: [transport, url]
          properties:
            transport: { type: string, const: sse }
            url: { type: string, format: uri }
            headers:
              type: object
              additionalProperties: { type: string }
        - type: object
          required: [transport, url]
          properties:
            transport: { type: string, const: http }
            url: { type: string, format: uri }
            headers:
              type: object
              additionalProperties: { type: string }

    MCPRequest:
      type: object
      description: |
        Additive chat block. When present, the gateway connects each listed MCP
        server, merges their tools (filtered by `enabledTools`) with any client
        `tools`, and runs a BOUNDED server-side tool loop (≤ 8 model calls),
        emitting `mcp_tool_call` / `mcp_tool_result` SSE events. Absent ⇒ the
        existing flow is unchanged.
      required: [servers]
      additionalProperties: false
      properties:
        servers:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/MCPServerConfig"
        enabledTools:
          type: array
          description: |
            Optional allow-list of tool names to expose (raw `name` or namespaced
            `mcp__<serverId>__<tool>`). Omit to expose every advertised tool.
          items: { type: string }

    ResponseFormat:
      type: object
      description: |
        Structured / JSON output request. `json_schema` asks for schema-conformant
        JSON; `json_object` asks only for syntactically-valid JSON; `text` (default)
        is free-form. A STRICT `json_schema` request (`strict: true`) DEMANDS a
        provider that guarantees conformance — an unsupported provider yields a 422
        `unsupported_capability` (required: ["json_schema"]). Structured requests are
        BUFFERED and validated, not token-streamed: on the streaming path the text
        arrives then a single terminal frame carries `parsed` + `structured_output`.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [text, json_object, json_schema]
        schema:
          type: object
          description: JSON Schema for the output. Required when `type` is `json_schema`.
        name:
          type: string
          description: Human name for the schema (forwarded to providers that want one).
        strict:
          type: boolean
          description: |
            When true, DEMANDS a provider that GUARANTEES schema conformance; a
            non-conformant result returns 422 `structured_output_invalid` rather
            than a 200 with prose.
        maxRepairAttempts:
          type: integer
          minimum: 0
          maximum: 2

    ToolDefinition:
      type: object
      description: A tool the model may call. Mirrors @zintus/types ToolDefinition.
      required: [name, description, parameters]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,64}$"
        description:
          type: string
        parameters:
          type: object
          description: JSON Schema for the tool input (passed through to the provider).
        strict:
          type: boolean

    ToolCall:
      type: object
      description: |
        A model's request to invoke a tool, OpenAI-shape. On the streaming path
        these arrive as `choices[].delta.tool_calls[]` (each carrying `index`)
        followed by a `finish_reason: "tool_calls"` delta; on the non-streaming
        path they live on the assistant `message.tool_calls`.
      required: [id, type, function]
      additionalProperties: false
      properties:
        id: { type: string }
        type: { type: string, const: function }
        function:
          type: object
          required: [name, arguments]
          additionalProperties: false
          properties:
            name: { type: string }
            arguments:
              type: string
              description: JSON-stringified arguments object.

    ChatCompletionChoice:
      type: object
      required: [index, message, finish_reason]
      additionalProperties: false
      properties:
        index: { type: integer }
        message:
          allOf:
            - $ref: "#/components/schemas/ChatMessage"
            - type: object
              properties:
                tool_calls:
                  type: array
                  description: |
                    Present when the assistant turn ended to await tool results
                    (finish_reason "tool_calls"); `content` may be null.
                  items:
                    $ref: "#/components/schemas/ToolCall"
        finish_reason:
          type: string
          description: '`stop` for a normal answer, `tool_calls` when the turn emitted tool calls.'
          example: stop

    ChatCompletion:
      type: object
      description: |
        Non-streaming completion. Deviates from OpenAI: no `created`/`usage`;
        `id` is a routing trace UUID; extra `provider`/`thread_id`/
        `compile_trace_id` fields.
      required: [id, object, model, choices]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Routing trace id (UUID).
        object:
          type: string
          const: chat.completion
        model:
          type: string
        provider:
          type: string
        thread_id:
          type: [string, "null"]
        compile_trace_id:
          type: [string, "null"]
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        parsed:
          description: |
            The validated, parsed structured-output value. Present only for a
            structured request (`response_format`) whose output validated.
        structured_output:
          $ref: "#/components/schemas/StructuredOutputMeta"

    StructuredOutputMeta:
      type: object
      description: |
        Honesty metadata for a structured-output response. `served_level` is what
        the chosen provider could actually serve (`prompt` = emulated, never
        guaranteed); `guaranteed` is true ONLY when `served_level` is `json_schema`.
      required: [requested, served_level, guaranteed, valid, repair_attempts]
      additionalProperties: false
      properties:
        requested:
          type: string
          enum: [json_object, json_schema]
        served_level:
          type: string
          enum: [json_schema, json_object, prompt]
        guaranteed:
          type: boolean
        valid:
          type: boolean
        repair_attempts:
          type: integer
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            additionalProperties: false
            properties:
              path: { type: string }
              message: { type: string }

    ChatCompletionChunk:
      type: object
      description: "A single SSE delta event (the JSON after the SSE data: prefix)."
      required: [id, object, model, choices]
      additionalProperties: false
      properties:
        id: { type: string }
        object:
          type: string
          const: chat.completion.chunk
        model: { type: string }
        provider: { type: string }
        thread_id: { type: [string, "null"] }
        compile_trace_id: { type: [string, "null"] }
        choices:
          type: array
          items:
            type: object
            required: [index, delta]
            additionalProperties: false
            properties:
              index: { type: integer }
              delta:
                type: object
                properties:
                  content: { type: string }
                  tool_calls:
                    type: array
                    description: |
                      Streamed tool calls. After the text deltas drain, each tool
                      call is emitted as one chunk carrying a single entry (with
                      `index`), then a final delta sets `finish_reason: "tool_calls"`.
                    items:
                      type: object
                      required: [index, id, type, function]
                      additionalProperties: false
                      properties:
                        index: { type: integer }
                        id: { type: string }
                        type: { type: string, const: function }
                        function:
                          type: object
                          required: [name, arguments]
                          additionalProperties: false
                          properties:
                            name: { type: string }
                            arguments: { type: string }
              finish_reason:
                type: [string, "null"]
                description: '`tool_calls` on the terminating tool-call delta; null/absent otherwise.'

    ResearchRequest:
      type: object
      description: Mirrors @zintus/schemas ResearchRequestSchema.
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Required in practice — empty/missing yields 400.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        depth:
          type: string
          enum: [quick, standard, deep]
        provider:
          $ref: "#/components/schemas/ProviderId"
        model:
          type: string
        thread_id:
          type: string

    ProviderStatus:
      type: object
      required: [id, available, hasKey, inCooldown, quotaUsed, quotaLimit]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ProviderId"
        available: { type: boolean }
        hasKey: { type: boolean }
        inCooldown: { type: boolean }
        quotaUsed: { type: integer }
        quotaLimit:
          type: [integer, "null"]

    Savings:
      type: object
      required: [estimatedUsdSaved, byProvider, note]
      additionalProperties: false
      properties:
        estimatedUsdSaved:
          type: number
        byProvider:
          type: object
          additionalProperties: { type: number }
        note:
          type: string
          example: "estimate vs. paid-API list pricing"

    ActivityEntry:
      type: object
      description: |
        A single normalized usage record derived from a routing trace. Cost is
        $0 on the free tier (never fabricated); token counts are 0 when not
        recorded; `route_reason` is present only when the trace recorded one.
      required:
        [id, created, created_at, provider, model, tokens, cost_usd, saved_vs_baseline_usd, latency_ms, cache_hit]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The trace id of the request.
        created:
          type: integer
          description: Unix timestamp (seconds) when the request started.
        created_at:
          type: string
          format: date-time
          description: ISO-8601 start timestamp (same instant as `created`).
        provider:
          description: Winning provider id, or null when none was recorded.
          oneOf:
            - $ref: "#/components/schemas/ProviderId"
            - type: "null"
        model:
          type: [string, "null"]
        tokens:
          type: object
          required: [input, output, total]
          additionalProperties: false
          properties:
            input: { type: integer }
            output: { type: integer }
            total: { type: integer }
        cost_usd:
          type: number
          description: Real user cost. Always 0 on the free tier; never invented.
        saved_vs_baseline_usd:
          type: number
          description: Estimated USD saved vs. a paid baseline. 0 when not derivable.
        latency_ms:
          type: [number, "null"]
        cache_hit:
          type: boolean
        route_reason:
          type: string
          description: Present only when the trace recorded a routing reason.

    ActivityList:
      type: object
      required: [object, data, has_more]
      additionalProperties: false
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        has_more:
          type: boolean
          description: True when more entries exist beyond the returned page.

    KeyStatus:
      type: object
      required: [object, label, is_free_tier, providers, managed_keys_available]
      additionalProperties: false
      properties:
        object:
          type: string
          const: key_status
        label:
          type: string
          example: zintus-gateway
        is_free_tier:
          type: boolean
          description: Always true — Zintus routes to provider free tiers.
        providers:
          type: array
          items:
            type: object
            required:
              [id, has_key, available, in_cooldown, quota_used, quota_limit, quota_remaining_ratio]
            additionalProperties: false
            properties:
              id:
                $ref: "#/components/schemas/ProviderId"
              has_key: { type: boolean }
              available: { type: boolean }
              in_cooldown: { type: boolean }
              quota_used: { type: integer }
              quota_limit:
                description: |
                  The provider's reported quota denominator, or null when the
                  provider does not report one (never a fabricated cap).
                type: [integer, "null"]
              quota_remaining_ratio:
                description: |
                  Remaining quota ratio (0..1), or null when `quota_limit` is
                  unknown.
                oneOf:
                  - type: number
                    minimum: 0
                    maximum: 1
                  - type: "null"
        managed_keys_available:
          type: boolean
          description: Always false — Zintus never custodies provider keys.

    RouteOptions:
      type: object
      required:
        [provider, quotaRemaining, resetIn, best, options, reason, alternatives, localAvailable]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: The evaluated provider id.
        quotaRemaining:
          description: |
            Remaining quota ratio (0..1) from the server ledger when the provider
            is keyed, else the client hint, else null. Never fabricated.
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        resetIn:
          description: |
            Seconds until reset, ONLY when the ledger genuinely tracks it (e.g. a
            429 / Groq reset header or backoff cooldown); otherwise null.
          oneOf:
            - type: integer
            - type: "null"
        resetReason:
          type: string
          description: Present only when `resetIn` is null.
          example: "Reset time unavailable"
        best:
          type: string
          description: The recommended BYOK action.
          enum: [compress_harder, switch_provider, use_local, wait]
        options:
          type: array
          description: BYOK-only actions available. Never includes a paid/credits option.
          items:
            type: string
            enum: [compress_harder, switch_provider, use_local, wait]
        reason:
          type: string
          description: Human-readable explanation of the recommendation.
        alternatives:
          type: array
          description: |
            Cheapest healthy BYOK providers to switch to, priced from a static
            ESTIMATE catalog (not billing truth). Empty when none are healthy.
          items:
            type: object
            required: [provider, model, estInputPer1M, estOutputPer1M]
            additionalProperties: false
            properties:
              provider:
                type: string
              model:
                type: string
              estInputPer1M:
                type: number
              estOutputPer1M:
                type: number
        localAvailable:
          type: boolean
          description: Whether a local Ollama/LM Studio runtime was detected.

    Status:
      type: object
      required: [ok, providers, savings]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
        savings:
          $ref: "#/components/schemas/Savings"

    TraceAttempt:
      type: object
      required: [providerId, model, status, latencyMs]
      additionalProperties: false
      properties:
        providerId:
          $ref: "#/components/schemas/ProviderId"
        model: { type: string }
        status:
          type: string
          enum: [success, fail]
        latencyMs: { type: number }
        errorCode: { type: integer }
        errorMessage: { type: string }

    RequestTrace:
      type: object
      required: [traceId, startedAt, attempts]
      additionalProperties: false
      properties:
        traceId: { type: string }
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/TraceAttempt"
        winner:
          type: object
          required: [providerId, model]
          additionalProperties: false
          properties:
            providerId:
              $ref: "#/components/schemas/ProviderId"
            model: { type: string }
        totalLatencyMs:
          type: number

    Model:
      type: object
      description: |
        Enriched, OpenRouter-grade model entry. The top-level
        `{ id, object, owned_by }` triple stays OpenAI-compatible; every other
        field is additive per-model metadata sourced from the Zintus catalog.
        Pricing is USD per 1M tokens and is `null` when the list price is unknown
        (never invented).
      required: [id, object, owned_by]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Model id exactly as passed to the provider API.
        object:
          type: string
          const: model
        owned_by:
          type: string
          description: Provider display name.
        display_name:
          type: string
          description: Human-facing label ("Provider · model").
        context_window:
          type: integer
          description: Maximum context window in tokens.
        capabilities:
          type: object
          additionalProperties: false
          properties:
            vision:
              type: boolean
            tools:
              type: boolean
            structured_output:
              type: string
              enum: [json_schema, json_object, none]
        pricing:
          type: object
          additionalProperties: false
          description: USD per 1M tokens; null when the price is unknown.
          properties:
            input_per_1m:
              type: [number, "null"]
            output_per_1m:
              type: [number, "null"]
        free:
          type: boolean
          description: True when the model's list price is $0 (local or free route).
        local:
          type: boolean
          description: True for local runtimes (LM Studio, Ollama).
        data_policy:
          type: object
          description: Best-effort free-tier data-handling summary for the provider.
          additionalProperties: true

    ModelList:
      type: object
      required: [object, data]
      additionalProperties: false
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    PricingEntry:
      type: object
      description: |
        Per-model list pricing (USD per 1M tokens). Only models with a KNOWN
        price are listed by `/v1/pricing` — unknown prices are omitted, not guessed.
      required: [id, provider, input_per_1m, output_per_1m, free]
      additionalProperties: false
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        input_per_1m:
          type: number
        output_per_1m:
          type: number
        free:
          type: boolean

    PricingList:
      type: object
      required: [object, data]
      additionalProperties: false
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PricingEntry"

    Thread:
      type: object
      required: [id, title, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ThreadMessage:
      type: object
      description: A stored thread message (a ChatMessage plus persistence metadata).
      required: [role, content, id, threadId, createdAt]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/ChatRole"
        content: { type: string }
        id: { type: string }
        threadId: { type: string }
        providerId: { type: string }
        model: { type: string }
        traceId: { type: string }
        createdAt:
          type: string
          format: date-time

    MemoryFact:
      type: object
      description: >
        A user-owned memory fact. Facts are BACKGROUND DATA used to personalize
        context — never instructions and never granted system authority.
      required: [id, key, value, scope, pinned, createdAt, updatedAt]
      properties:
        id: { type: string }
        threadId:
          type: string
          nullable: true
          description: Null for project- and global-scoped facts.
        key: { type: string }
        value: { type: string }
        source: { type: string }
        scope:
          type: string
          enum: [thread, project, global]
        projectId: { type: string }
        pinned: { type: boolean }
        lastUsedAt:
          type: integer
          description: Epoch ms the fact was last included in a compiled context.
        sourceMessageId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CompileTrace:
      type: object
      description: |
        A persisted context-compile trace row. `trace` is an open JSON record of
        engine-internal compile details (shape not part of this contract).
      required: [id, threadId, trace, createdAt]
      additionalProperties: false
      properties:
        id: { type: integer }
        threadId: { type: string }
        trace:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    MetricsSnapshot:
      type: object
      required:
        - uptimeSeconds
        - requestsTotal
        - requestsByOutcome
        - chatCompletionsTotal
        - chatByProvider
        - errorsTotal
        - rateLimitedTotal
        - latencyMs
        - tokzen
        - searchByStrategy
      additionalProperties: false
      properties:
        uptimeSeconds: { type: integer }
        requestsTotal: { type: integer }
        requestsByOutcome:
          type: object
          required: [ok, clientError, serverError]
          additionalProperties: false
          properties:
            ok: { type: integer }
            clientError: { type: integer }
            serverError: { type: integer }
        chatCompletionsTotal: { type: integer }
        chatByProvider:
          type: object
          additionalProperties: { type: integer }
        errorsTotal: { type: integer }
        rateLimitedTotal: { type: integer }
        latencyMs:
          type: object
          required: [count, sum, max, avg]
          additionalProperties: false
          properties:
            count: { type: integer }
            sum: { type: integer }
            max: { type: integer }
            avg: { type: integer }
        tokzen:
          type: object
          required:
            - tokensSavedTotal
            - avgCompressionRatio
            - cacheHitRate
            - compressionsByProvider
          additionalProperties: false
          properties:
            tokensSavedTotal: { type: integer }
            avgCompressionRatio: { type: number }
            cacheHitRate: { type: number }
            compressionsByProvider:
              type: object
              additionalProperties: { type: integer }
        searchByStrategy:
          type: object
          additionalProperties: { type: integer }

    Error:
      type: object
      description: Standard error envelope used by most endpoints.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [message]
          additionalProperties: false
          properties:
            message:
              type: string
            type:
              type: string
              description: Present on rate-limit errors (`rate_limit_error`).
            issues:
              type: array
              description: Field-level zod validation failures (400 only).
              items:
                type: object
                required: [path, message]
                additionalProperties: false
                properties:
                  path: { type: string }
                  message: { type: string }

    StringError:
      type: object
      description: |
        Legacy/inconsistent error shape on a few routes where `error` is a bare
        string rather than an object (e.g. trace-not-found, 404 "Not found").
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
