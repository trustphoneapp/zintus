name = "zintus-relay"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

# relay.zintus.ai is same-site with www.zintus.ai, which lets the session
# cookie carry Domain=.zintus.ai and survive Safari ITP / third-party-cookie
# blocking. Requires relay.zintus.ai to exist as an active zone in this
# Cloudflare account (see deploy sequence below) before `wrangler deploy`
# will succeed.
[[routes]]
pattern = "relay.zintus.ai"
custom_domain = true

[[durable_objects.bindings]]
name = "GATEWAY_SESSION"
class_name = "GatewaySession"

# Atomic, strongly-consistent per-user/period token-usage counter (B3 quota
# enforcement). One instance per `user:period`; see src/QuotaCounter.ts.
[[durable_objects.bindings]]
name = "QUOTA_COUNTER"
class_name = "QuotaCounter"

# One instance per Zintus user serializes GitHub credential replacement,
# refresh-token rotation, and revocation across every Worker isolate.
[[durable_objects.bindings]]
name = "GITHUB_CREDENTIALS"
class_name = "GithubCredentialBroker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewaySession"]

# v2: introduce the QuotaCounter DO. Additive — does not touch the existing
# GatewaySession binding/class. Deploy applies this automatically on the next
# `wrangler deploy`.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["QuotaCounter"]

# v3: move GitHub credential authority out of isolate-local memory/KV and into
# a per-user Durable Object. Legacy encrypted KV records migrate on first use.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["GithubCredentialBroker"]

[[d1_databases]]
binding = "DB"
database_name = "zintus-relay"
database_id = "1320e7ad-6ab9-4a28-a5b2-255ffc13d58d"

[[kv_namespaces]]
binding = "KV"
id = "e37d30031cb2409daa2fd5d44003ec0c"

# ── Deploy sequence (Step 8) ──────────────────────────────────────────────
# 1. Create D1 (if not yet created):
#      bunx wrangler d1 create zintus-relay
#    Update database_id above with the returned ID.
#
# 2. Apply schema:
#      bunx wrangler d1 execute zintus-relay --file=schema.sql --remote
#
# 3. Create KV namespace (if not yet created):
#      bunx wrangler kv namespace create ZINTUS_KV
#    Update id above with the returned ID.
#
# 4. Set secrets:
#      bunx wrangler secret put GOOGLE_CLIENT_ID
#      bunx wrangler secret put GOOGLE_CLIENT_SECRET
#      bunx wrangler secret put RESEND_API_KEY
#
# 5. Add relay.zintus.ai as a Cloudflare zone (subdomain delegation):
#      - Cloudflare dashboard → Add a Site → "relay.zintus.ai"
#      - Add the NS records Cloudflare gives you at your DNS provider for the
#        "relay" subdomain (zintus.ai apex/www stay wherever they are now —
#        only the relay subdomain delegates to Cloudflare's nameservers)
#      - Wait for the zone to go active, then `wrangler deploy` will bind
#        the custom_domain route above
#
# 6. Deploy:
#      bunx wrangler deploy
#
# 7. Verify security headers (Step 9):
#      curl -I https://relay.zintus.ai/health
#
# Secrets — set via: bunx wrangler secret put <NAME>
# GOOGLE_CLIENT_ID    — from console.cloud.google.com
# GOOGLE_CLIENT_SECRET
# RESEND_API_KEY      — from resend.com
# GITHUB_APP_ID, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GITHUB_PRIVATE_KEY,
# GITHUB_CALLBACK_URL, RELAY_ENCRYPTION_KEY — GitHub App connector secrets

[vars]
RELAY_BASE_URL = "https://relay.zintus.ai"
COOKIE_DOMAIN = ".zintus.ai"
WEB_BASE_URL = "https://www.zintus.ai"
