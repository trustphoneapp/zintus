name = "zintus-relay"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "GATEWAY_SESSION"
class_name = "GatewaySession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewaySession"]

[[d1_databases]]
binding = "DB"
database_name = "zintus-relay"
database_id = "1320e7ad-6ab9-4a28-a5b2-255ffc13d58d"

[[kv_namespaces]]
binding = "KV"
id = "e37d30031cb2409daa2fd5d44003ec0c"

# Secrets — set via: wrangler secret put <NAME>
# RELAY_AUTH_SECRET   — random hex, signs session tokens
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# RESEND_API_KEY
# RELAY_BASE_URL      — e.g. https://relay.zintus.app

[vars]
RELAY_BASE_URL = "https://zintus-relay.yashwanth-surabhi.workers.dev"
